name: Molecule search
on:
  workflow_dispatch:
    inputs:
      molecule:
        description: "Molecule or brand name"
        required: true
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python scripts/molecule.py
        env:
          MOLECULE: ${{ inputs.molecule }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Molecule search"
          git pull --rebase
          git push
