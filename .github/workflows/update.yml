name: Update news
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Write a new report now"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python scripts/fetch.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REPORT: ${{ inputs.report }}
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update news"
          git push
