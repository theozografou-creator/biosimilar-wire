<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biosimilar Wire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">
<title>Biosimilar Wire</title>
<style>
:root{--bg:#f6f3ec;--ink:#1b1d1a;--mute:#6b6f66;--line:#d9d4c6;--acc:#0b6b57;--card:#fffdf8}
@media (prefers-color-scheme:dark){:root{--bg:#131614;--ink:#e9e6dc;--mute:#9aa093;--line:#2c312c;--acc:#5fc9ae;--card:#1a1e1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.wrap{max-width:780px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
header{border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:14px}
h1{font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.meta,.ctl,button,select,input,.src,.tag{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.74rem}
.meta{color:var(--mute);margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button,select,input{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px 10px;border-radius:3px}
button{cursor:pointer}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ctl input{flex:1;min-width:140px}
h2.day{font-size:.78rem;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);border-bottom:1px solid var(--line);padding:18px 0 4px;margin:0}
article{padding:12px 0;border-bottom:1px solid var(--line)}
article a.t{color:var(--ink);text-decoration:none;font-size:1.12rem;font-weight:600;line-height:1.3}
article a.t:hover{color:var(--acc);text-decoration:underline}
article p{margin:4px 0 0;color:var(--mute);font-size:.95rem}
.src{color:var(--mute);margin-bottom:3px}
.tag{color:var(--acc);border:1px solid var(--acc);padding:0 5px;border-radius:2px;margin-left:6px}
.rep{background:var(--card);border:1px solid var(--line);padding:4px 18px 14px;margin-bottom:16px}
.rep h3{font-size:1.05rem;margin:18px 0 4px}
.rep ul{margin:0;padding-left:20px}.rep li{margin:6px 0}
.rep a,.note a{color:var(--acc)}
.note{color:var(--mute);font-size:.92rem;padding:14px 0}
.bad{color:#c0392b}
.prof{background:var(--card);border:1px solid var(--line);padding:12px 16px;margin:8px 0}
.prof h3{margin:0 0 6px;font-size:1.3rem}.prof div{font-size:.95rem}.prof b{font-weight:600}
h2.sec{font-size:1.15rem;margin:26px 0 0;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.secnote{color:var(--mute);font-size:.9rem;margin:4px 0 0}
#mSaved button{padding:4px 8px}
</style>
</head>
<body><div class="wrap">
<header><h1>Biosimilar Wire</h1><div class="meta" id="meta">Loading ...</div></header>
<div class="tabs"><button id="tNews" class="on">News</button><button id="tRep">Reports</button><button id="tMol">Molecule</button></div>
<section id="news">
 <div class="ctl">
  <button id="fBio" class="on">Biosimilars</button><button id="fAll">All biotech</button>
  <select id="fSrc"><option value="">All sources</option></select>
  <select id="fDays"><option value="1">24 hours</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="999">Everything</option></select>
  <input id="fQ" type="search" placeholder="Search">
 </div>
 <div id="list"></div>
</section>
<section id="reports" hidden></section>
<section id="mol" hidden>
 <div class="ctl">
  <input id="mQ" type="search" placeholder="Molecule or brand, e.g. ustekinumab" enterkeyhint="search" autocapitalize="off" autocorrect="off">
  <button id="mGo" class="on">Search</button>
  <select id="mMonths"><option value="6">6 months</option><option value="12" selected>12 months</option></select>
 </div>
 <div class="ctl" id="mSaved"></div>
 <div id="mOut"></div>
 <details class="note"><summary>Access key</summary>
  <p>Opening saved searches works for everyone. Starting a new search needs a GitHub access key. It is stored only on this device.</p>
  <div class="ctl"><input id="mKey" type="password" placeholder="github_pat_..."><button id="mKeySave">Save</button></div>
 </details>
</section>
<div class="meta" id="feeds" style="margin-top:30px"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
let data={items:[],feeds:[]},reports=[],bioOnly=true;
const isBio=x=>x.score!=null?x.score>=2:x.biosimilar;

function render(){
  const days=+$("fDays").value,src=$("fSrc").value,q=$("fQ").value.toLowerCase().trim();
  const since=new Date(Date.now()-days*864e5).toISOString();
  const rows=data.items.filter(x=>(!bioOnly||isBio(x))&&(!src||x.source===src)&&x.date>=since&&
    (!q||(x.title+" "+(x.summary||x.snippet)+" "+x.source).toLowerCase().includes(q)));
  const list=$("list");list.textContent="";
  if(!rows.length){list.append(el("p","note",data.updated?"Nothing matches these filters.":"No data yet. The first update has not run."));return}
  let last="";
  for(const x of rows){
    const d=new Date(x.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
    if(d!==last){list.append(el("h2","day",d));last=d}
    const a=el("article"),s=el("div","src",x.source);
    if(!bioOnly&&isBio(x))s.append(el("span","tag","biosimilar"));
    for(const w of x.watch||[])s.append(el("span","tag",w));
    const t=el("a","t",x.title);t.href=x.link;t.target="_blank";t.rel="noopener";
    a.append(s,t);
    const body=x.summary||x.snippet;if(body)a.append(el("p",null,body));
    list.append(a);
  }
}

function md(text){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out="",ul=false;
  for(const raw of text.split("\n")){
    const l=raw.trim();
    const li=l.match(/^[-*]\s+(.*)/),h=l.match(/^#{1,3}\s+(.*)/);
    if(li){if(!ul){out+="<ul>";ul=true}out+="<li>"+inl(li[1])+"</li>";continue}
    if(ul){out+="</ul>";ul=false}
    if(h)out+="<h3>"+inl(h[1])+"</h3>";else if(l)out+="<p>"+inl(l)+"</p>";
  }
  return out+(ul?"</ul>":"");
}

let repBusy=false;
function digest(days){
  const since=new Date(Date.now()-days*864e5).toISOString(),seen=new Set();
  const cats=[["Litigation and patents",/patent|litigation|lawsuit|settle|court|bpcia|infring/i],
    ["Deals and partnerships",/\bdeal|licens|partner|acqui|agreement|collaborat|merger|buyout/i],
    ["Approvals and regulatory",/approv|\bfda\b|\bema\b|chmp|interchangeab|filing|regulator|positive opinion|guidance/i],
    ["Launches and market",/launch|pric|market|uptake|formulary|\bpbm|sales|revenue/i],["Other",/./]];
  const g=cats.map(()=>[]);let n=0;
  for(const x of data.items){
    if(x.date<since||!isBio(x))continue;
    const k=x.title.toLowerCase().replace(/ - [^-]+$/,"").replace(/[^a-z0-9]+/g," ").trim().slice(0,60);
    if(seen.has(k))continue;seen.add(k);n++;
    g[cats.findIndex(c=>c[1].test(x.title+" "+(x.summary||x.snippet||"")))].push(x);
  }
  const box=$("repNow");box.textContent="";
  const d=el("div","rep");d.append(el("h2","day",`Biosimilar headlines, last ${days} days · ${n} items`));
  if(!n)d.append(el("p","note","Nothing found for this period."));
  cats.forEach((c,i)=>{
    if(!g[i].length)return;
    g[i].sort((a,b)=>(b.score||0)-(a.score||0)||(a.date<b.date?1:-1));
    d.append(el("h3",null,c[0]));const ul=el("ul");
    for(const x of g[i].slice(0,10)){
      const li=el("li"),a=el("a",null,x.title);a.href=x.link;a.target="_blank";a.rel="noopener";
      li.append(a,el("span","meta"," "+x.source+", "+new Date(x.date).toLocaleDateString("en-GB",{day:"numeric",month:"short"})));ul.append(li);
    }
    d.append(ul);if(g[i].length>10)d.append(el("p","meta",`and ${g[i].length-10} more in the News tab`));
  });
  box.append(d);
}
async function makeReport(days){
  digest(days);
  const st=$("repStatus");
  if(!key()){st.textContent="This is a list of headlines by topic, not a written summary. For a written summary, save the access key in the Molecule tab and set the API key in the repository.";return}
  if(repBusy)return;repBusy=true;
  try{
    const first=reports[0]&&reports[0].date;
    st.textContent="Starting ...";
    const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches`,{method:"POST",
      headers:{Authorization:"Bearer "+key(),Accept:"application/vnd.github+json"},body:JSON.stringify({ref:"main",inputs:{report:"true",days:String(days)}})});
    if(r.status!==204){st.textContent="Could not start (GitHub answered "+r.status+"). Check the access key.";return}
    for(let i=1;i<=30;i++){
      st.textContent=`Writing the summary ... usually 1 to 2 minutes (${i*8}s). Headlines below in the meantime.`;
      await new Promise(r=>setTimeout(r,8000));
      const d=await ghRaw("data/reports.json");
      if(d&&d[0]&&d[0].date!==first){reports=d;$("repNow").textContent="";st.textContent="";renderReportList();return}
    }
    st.textContent="No written summary came back. Check that the API key is set in the repository.";
  }catch(e){st.textContent="Failed: "+e.message}finally{repBusy=false}
}
function renderReportList(){
  const box=$("repList");box.textContent="";
  for(const r of reports){
    const d=el("div","rep"),f=o=>new Date(o).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
    d.append(el("h2","day",`Summary · ${f(r.from)} to ${f(r.date)} · ${r.items} items`));
    const b=el("div");b.innerHTML=md(r.markdown);d.append(b);box.append(d);
  }
}
function renderReports(){
  const box=$("reports");box.textContent="";
  const c=el("div","ctl");
  for(const n of [7,14]){const b=el("button","on",`Summarize last ${n} days`);b.onclick=()=>makeReport(n);c.append(b)}
  const st=el("p","note");st.id="repStatus";const now=el("div");now.id="repNow";const list=el("div");list.id="repList";
  box.append(c,st,now,list);renderReportList();
}

const TABS={tNews:"news",tRep:"reports",tMol:"mol"};
function tab(id){for(const k in TABS){$(TABS[k]).hidden=k!==id;$(k).classList.toggle("on",k===id)}}
for(const k in TABS)$(k).onclick=()=>tab(k);

const REPO=(()=>{const m=location.hostname.match(/^(.+)\.github\.io$/),r=location.pathname.split("/")[1];return m&&r?m[1]+"/"+r:"theozografou-creator/biosimilar-wire"})();
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const key=()=>{try{return localStorage.getItem("bw_key")||""}catch(e){return""}};
const getJ=async p=>{try{const r=await fetch(p+"?t="+Date.now());return r.ok?await r.json():null}catch(e){return null}};
async function ghRaw(path){
  try{const h={Accept:"application/vnd.github.raw"};if(key())h.Authorization="Bearer "+key();
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?t=${Date.now()}`,{headers:h,cache:"no-store"});
    return r.ok?await r.json():null}catch(e){return null}}
const molGet=async p=>key()?(await ghRaw(p)||await getJ(p)):await getJ(p);
let molData=null,molBusy=false;
function molMsg(t){const o=$("mOut");o.textContent="";o.append(el("p","note",t))}
function showMol(d){
  if(d)molData=d;d=molData;if(!d)return;
  const o=$("mOut");o.textContent="";
  const since=new Date(Date.now()-(+$("mMonths").value)*30.5*864e5).toISOString(),p=d.profile;
  const box=el("div","prof");box.append(el("h3",null,p.inn));
  const row=(k,v)=>{if(v){const r=el("div");r.append(el("b",null,k+": "),v);box.append(r)}};
  row("Brand",(p.brands||[]).join(", "));row("Originator",p.originator);row("Mechanism",p.mechanism);row("Area",p.area);
  if(d.biosimilars&&d.biosimilars.length)row("Biosimilars",d.biosimilars.map(b=>b.company+(b.name?" ("+b.name+")":"")+(b.status?", "+b.status:"")).join(" · "));
  box.append(el("div","meta",(d.ai?"Profile and related molecules written by Claude. Check before relying on it. ":"Basic search: no related molecules, because no API key is set. ")+"Searched "+new Date(d.searched).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+". News from Google News, at most about 100 hits per molecule."));
  o.append(box);
  let rel=false;
  for(const s of d.sections){
    if(s.related&&!rel){rel=true;o.append(el("h2","day","Same mechanism, including next generation"))}
    const items=s.items.filter(x=>x.date>=since);
    o.append(el("h2","sec",s.title+" · "+items.length));
    if(s.note)o.append(el("p","secnote",s.note));
    if(!items.length)o.append(el("p","note","No news found in this period."));
    for(const x of items){
      const a=el("article");
      a.append(el("div","src",(x.source?x.source+" · ":"")+new Date(x.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})));
      const t=el("a","t",x.title);t.href=x.link;t.target="_blank";t.rel="noopener";a.append(t);o.append(a);
    }
  }
}
async function loadMolIndex(){
  const idx=await molGet("data/molecules/index.json")||[],b=$("mSaved");b.textContent="";
  for(const x of idx){const c=el("button",null,x.inn||x.query);c.onclick=async()=>{$("mQ").value=x.query;molMsg("Loading ...");const d=await molGet(`data/molecules/${x.slug}.json`);d?showMol(d):molMsg("Could not load this search.")};b.append(c)}
}
async function molSearch(){
  const q=$("mQ").value.trim(),s=slug(q);if(!s||molBusy)return;
  const old=await molGet(`data/molecules/${s}.json`);
  if(!key()){old?showMol(old):molMsg("No saved search for this. New searches need the access key (see below).");return}
  molBusy=true;
  try{
    molMsg("Starting search ...");
    const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/molecule.yml/dispatches`,{method:"POST",
      headers:{Authorization:"Bearer "+key(),Accept:"application/vnd.github+json"},body:JSON.stringify({ref:"main",inputs:{molecule:q}})});
    if(r.status!==204){molMsg("Could not start the search (GitHub answered "+r.status+"). Check the access key.");if(old)showMol(old);return}
    for(let i=1;i<=45;i++){
      molMsg(`Searching ... usually 1 to 2 minutes (${i*8}s)`);
      await new Promise(r=>setTimeout(r,8000));
      const d=await ghRaw(`data/molecules/${s}.json`);
      if(d&&(!old||d.searched!==old.searched)){showMol(d);loadMolIndex();return}
    }
    molMsg("This is taking longer than expected. Try again in a few minutes.");
  }catch(e){molMsg("Search failed: "+e.message)}finally{molBusy=false}
}
$("mGo").onclick=molSearch;$("mQ").onkeydown=e=>{if(e.key==="Enter")molSearch()};$("mMonths").onchange=()=>showMol();
$("mKey").value=key();
$("mKeySave").onclick=()=>{try{localStorage.setItem("bw_key",$("mKey").value.trim());$("mKeySave").textContent="Saved"}catch(e){$("mKeySave").textContent="Could not save"}};
loadMolIndex();
$("fBio").onclick=()=>{bioOnly=true;$("fBio").classList.add("on");$("fAll").classList.remove("on");render()};
$("fAll").onclick=()=>{bioOnly=false;$("fAll").classList.add("on");$("fBio").classList.remove("on");render()};
["fSrc","fDays"].forEach(i=>$(i).onchange=render);$("fQ").oninput=render;

(async()=>{
  const get=async p=>{try{const r=await fetch(p+"?t="+Date.now());return r.ok?await r.json():null}catch(e){return null}};
  data=await get("data/news.json")||data;reports=await get("data/reports.json")||[];
  $("meta").textContent=data.updated?`Updated ${new Date(data.updated).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})} · ${data.items.length} items`:"Not updated yet";
  for(const s of [...new Set(data.items.map(x=>x.source))].sort())$("fSrc").append(new Option(s,s));
  const f=$("feeds");
  if(data.feeds.length){f.append("Sources: ");data.feeds.forEach((s,i)=>{f.append(el("span",s.ok?null:"bad",s.name+(s.ok?"":" (failed)")),i<data.feeds.length-1?" · ":"")})}
  render();renderReports();
})();
</script>
</body></html>
